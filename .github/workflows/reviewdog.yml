name: "Reviewdog"
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  pull-requests: write
jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: "package.json"
      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@$(node -p "require('./package.json').packageManager.split('@')[1]") --activate
      - name: Enable Yarn cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: "package.json"
          cache: "yarn"
      - name: Install dependencies
        run: yarn
      - name: Run ESLint
        uses: reviewdog/action-eslint@6dad10dc50476699ad1ddbbb19bf55d36f311a39
        with:
          reporter: "github-pr-review"
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run trivy
        uses: reviewdog/action-trivy@c51bf26459dab6a2b5c34e7f43eeb475746f1a00
        with:
          reporter: "github-pr-review"
          trivy_command: fs
          trivy_target: .
          trivy_flags: --scanners secret
